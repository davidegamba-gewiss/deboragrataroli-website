# Decap CMS Configuration
# https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: davidegamba-gewiss/deboragrataroli-website
  branch: claude/setup-nextjs-14-project-TzmnH
  base_url: https://deboragrataroli.it
  auth_endpoint: api/auth
  app_id: Ov23lie5ZAfI8YGAL9S0

# Enable local backend for development (run: npm run cms)
local_backend: true

# Locale
locale: 'it'

# Media files
media_folder: public/media
public_folder: /media

# Slug configuration
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"


# Site URL for preview
site_url: https://deboragrataroli.it
display_url: https://deboragrataroli.it

# Logo for CMS
logo_url: /media/logo.png

# Collections
collections:
