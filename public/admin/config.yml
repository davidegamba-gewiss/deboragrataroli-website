            name: "title"
            widget: "string"
            required: true

          - label: "Descrizione SEO"
            name: "seo_description"
            widget: "text"
            required: false
            hint: "Descrizione per i motori di ricerca (max 160 caratteri)"

          - label: "Immagine Hero"
