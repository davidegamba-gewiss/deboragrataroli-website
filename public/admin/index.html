<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin - Debora Grataroli</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Custom styles for CMS -->
  <style>
    /* Loading state */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    /* Custom branding */
    [class*="AppHeaderLogo"] {
      font-family: 'Playfair Display', Georgia, serif !important;
    }

    /* Purple theme accents */
    [class*="ToolbarButton"]:hover,
    [class*="Button"]:not([class*="delete"]) {
      background-color: #9b59b6 !important;
    }

    /* Loading spinner while CMS loads */
    #nc-root:empty::before {
      content: '';
      display: block;
      width: 50px;
      height: 50px;
      margin: 100px auto;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #9b59b6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #c8a2d6;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #9b59b6;
    }
  </style>
</head>
<body>
  <!-- Decap CMS will mount here -->
  <div id="nc-root"></div>

  <!-- Decap CMS Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Custom preview styles -->
  <script>
    // Register custom preview styles
    CMS.registerPreviewStyle('/admin/preview-styles.css');

    // Custom widget registration example (if needed in future)
    // CMS.registerWidget('customWidget', CustomControl, CustomPreview);

    // Initialize CMS
    CMS.init();
  </script>
</body>
</html>
